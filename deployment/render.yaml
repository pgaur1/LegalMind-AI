# ============================================================================
# Render.com Deployment Configuration
# ============================================================================
# This file configures both frontend (Static Site) and backend (Web Service)
# on Render's free tier

services:
  # Backend - Python FastAPI Web Service
  - type: web
    name: legalmind-backend
    env: python
    region: singapore  # or your preferred region
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: cd backend && uvicorn main:app --host 0.0.0.0 --port $PORT --timeout-keep-alive 120
    healthCheckPath: /health
    envVars:
      - key: LLM_PROVIDER
        value: huggingface
      - key: HF_TOKEN
        sync: false  # Set this in Render dashboard as secret
      - key: HF_MODEL
        value: Qwen/Qwen2.5-7B-Instruct
      - key: PORT
        value: 8000
      - key: DEBUG
        value: false
      - key: LOG_LEVEL
        value: INFO
      - key: PYTHONUNBUFFERED
        value: 1

  # Frontend - Static Site
  - type: web
    name: legalmind-frontend
    env: static
    region: singapore  # or your preferred region
    plan: free
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: ./frontend/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        value: https://legalmind-backend.onrender.com  # Update with your backend URL
